          const ds = opt.dataset.date;
          state.formDraft.date = ds;
          state.formDraft.slot = '';
          label.textContent = formatDateOptionLabel(ds);
          trigger.style.cssText = triggerStyle(ds);
          panel.querySelectorAll('.date-option').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
          panel.hidden = true;
          dateSelect.classList.remove('open');
          updateSlotGroupsUI();
          loadSlotAvailabilityForDate(ds);
        };
      });
    }
    wireSlotPills();

    const carRowsContainer = root.querySelector('#car-rows');
    function syncCarsDraftFromDOM(){
      if(!carRowsContainer) return;
      state.formDraft.cars = Array.from(carRowsContainer.querySelectorAll('.car-row')).map(row => ({
        carType: row.querySelector('.car-type').value,
        plate: row.querySelector('.car-plate').value,
        pkg: row.querySelector('.car-pkg').value
      }));
      updateDock();
    }
    function updateDock(){
      const rows = carRowsContainer ? Array.from(carRowsContainer.querySelectorAll('.car-row')) : [];
      let total = 0;
      rows.forEach(r => { const t = r.querySelector('.car-type').value; if(t) total += getPrice(t, r.querySelector('.car-pkg').value); });
      const dockCars = rows.map(r => ({ carType: r.querySelector('.car-type').value, pkg: r.querySelector('.car-pkg').value }));
      const disc = state.firstTime ? firstTimeDiscountPick(dockCars).amount : 0;
      total = Math.max(0, total - disc);
      const c = root.querySelector('#dock-count'), t = root.querySelector('#dock-total');
      if(c) c.textContent = rows.length + (rows.length === 1 ? ' car' : ' cars') + (disc ? ' · first-time -' + formatRM(disc) : '');
      if(t) t.textContent = formatRM(total);
    }
    window.__updateDock = updateDock;
    function wireCarRowInputs(row){
      const typeSelect = row.querySelector('.car-type');
      const pkgSelect = row.querySelector('.car-pkg');
      const refreshPrice = () => {
        syncCarsDraftFromDOM();
        const priceEl = row.querySelector('.car-row-price');
        if(priceEl) priceEl.textContent = typeSelect.value ? formatRM(getPrice(typeSelect.value, pkgSelect.value)) : '';
      };
      typeSelect.onchange = refreshPrice;
      pkgSelect.onchange = refreshPrice;
      row.querySelector('.car-plate').oninput = syncCarsDraftFromDOM;
    }
    function wireRemoveButton(btn){
      btn.onclick = () => {
        const rows = carRowsContainer.querySelectorAll('.car-row');
        if(rows.length <= 1) return; // keep at least one row
        btn.closest('.car-row').remove();
        syncCarsDraftFromDOM();
      };
    }
    if(carRowsContainer){
      carRowsContainer.querySelectorAll('.car-row').forEach(row => {
        wireCarRowInputs(row);
        wireRemoveButton(row.querySelector('.remove-car-row'));
      });
    }
    updateDock();
    const addCarBtn = root.querySelector('#add-car-btn');
    if(addCarBtn && carRowsContainer){
      addCarBtn.onclick = () => {
        const nextIdx = carRowsContainer.querySelectorAll('.car-row').length;
        carRowsContainer.insertAdjacentHTML('beforeend', carRowHtml(nextIdx));
        const newRow = carRowsContainer.lastElementChild;
        wireCarRowInputs(newRow);
        wireRemoveButton(newRow.querySelector('.remove-car-row'));
        syncCarsDraftFromDOM();
        const hint = root.querySelector('#cars-hint'); if(hint) hint.hidden = false;
      };
    }

    function allocateSlots(startSlot, carCount, latest, date){
      const info = getBlockAndIndex(startSlot);
      if(!info) return { error: 'Please select a valid time slot.' };
      const blockSlots = SLOT_BLOCKS[info.block];
      let idx = info.idx;
      let remaining = carCount;
      const allocation = [];
      while(remaining > 0){
        if(idx >= blockSlots.length){
          return { error: `Not enough consecutive slots to fit ${carCount} car(s) starting at ${startSlot} before the end of that time block. Please choose an earlier starting time or fewer cars.` };
        }
        const slot = blockSlots[idx];
        const used = latest.filter(c => c.date === date && c.slot === slot).length;
        const capLeft = SLOT_CAPACITY - used;
        if(capLeft > 0){
          const take = Math.min(capLeft, remaining);
          allocation.push({ slot, count: take });
          remaining -= take;
        }else if(allocation.length === 0){
          return { error: `That starting time is already fully booked. Please choose a different time or date.` };
        }else{
          return { error: `The ${slot} slot is already full, which blocks fitting all ${carCount} car(s) back-to-back from ${startSlot}. Please choose a different starting time or fewer cars.` };
        }
        idx++;
      }
      return { allocation };
    }

    const toTicketTop = () => { const t = root.querySelector('.ticket'); if(t) t.scrollIntoView({ behavior:'smooth', block:'start' }); };
    const backBtn = root.querySelector('#back-btn');
    if(backBtn) backBtn.onclick = () => { state.step = Math.max(1, state.step - 1); state.submitError = ''; render(); toTicketTop(); };
    const nextBtn = root.querySelector('#next-btn');
    if(nextBtn) nextBtn.onclick = () => {
      state.submitError = '';
      if(state.step === 1){
        const rows = Array.from(root.querySelectorAll('#car-rows .car-row'));
        if(rows.some(r => !r.querySelector('.car-type').value || !r.querySelector('.car-plate').value.trim())){
          state.submitError = 'Please choose the car type and enter the plate for every car.';
          render();
          return;
        }
        state.formDraft.slot = '';
      }else if(state.step === 2){
        if(!state.formDraft.date || !state.formDraft.slot){
          state.submitError = 'Please pick a date and a starting time.';
          render();
          return;
        }
      }
      state.step = Math.min(3, state.step + 1);
      render();
      toTicketTop();
    };
    const submitBtn = root.querySelector('#submit-btn');
    if(submitBtn){
      submitBtn.onclick = async () => {
        state.justSubmitted = false;
        const name = document.getElementById('f-name').value.trim();
        const phone = document.getElementById('f-phone').value.trim();
        const address = document.getElementById('f-address').value.trim();
        const date = state.formDraft.date;
        const slot = state.formDraft.slot;

        const carRows = Array.from(root.querySelectorAll('#car-rows .car-row')).map(row => ({
          carType: row.querySelector('.car-type').value.trim(),
          plate: row.querySelector('.car-plate').value.trim(),
          pkg: row.querySelector('.car-pkg').value
        }));

        if(!name || !phone || !address || !date || !slot){
          state.submitError = 'Please fill in your name, phone, address, date, and starting time.';
          render();
          return;
        }
        if(carRows.some(c => !c.carType || !c.plate)){
          state.submitError = 'Please fill in the car type and plate for every car listed.';
          render();
          return;
        }
        if(carRows.some(c => !plateDocId(c.plate))){
          state.submitError = 'Please enter a valid plate number (letters and numbers).';
          render();
          return;
        }
        if(!isWeekend(date)){
          state.submitError = 'We only wash cars on Saturdays and Sundays — please pick a weekend date.';
          render();
          return;
        }

        if(state.closedDates.has(date)){
          state.submitError = 'Sorry, we are closed for bookings on that date. Please pick another date.';
          render();
          return;
        }

        // duplicate plates within this same submission
        const platesInSubmission = carRows.map(c => plateDocId(c.plate));
        const dupWithinSubmission = platesInSubmission.some((p, i) => platesInSubmission.indexOf(p) !== i);
        if(dupWithinSubmission){
          state.submitError = 'You\'ve entered the same plate number twice — please check your car list.';
          render();
          return;
        }

        state.submitting = true;
        state.submitError = '';
        render();
        try{
          if(!storageAvailable()) throw new Error('Storage is not available' + (fbInitError ? (': ' + fbInitError) : '.'));
          try{
            if(closedDatesRef && (await closedDatesRef.doc(date).get()).exists){
              state.submitting = false;
              state.submitError = 'Sorry, we are closed for bookings on that date. Please pick another date.';
              render();
              return;
            }
          }catch(e){ /* fail open */ }
          await checkFirstTimer(phone);
          const ftPick = state.firstTime ? firstTimeDiscountPick(carRows) : { index: -1, amount: 0 };
          const ftDiscount = ftPick.amount;
          let latest = [];
          try{
            latest = await fetchSlotsForDate(date);
          }catch(e){ latest = []; }

          for(const c of carRows){
            let taken = false;
            try{
              taken = (await platesCollectionRef.doc(plateDocId(c.plate)).get()).exists;
            }catch(e){ taken = false; }
            if(taken){
              state.submitting = false;
              state.submitError = `Plate ${c.plate} is already registered. If this is a mistake, please contact us.`;
              render();
              return;
            }
          }

          const plan = planBooking(carRows, parseInt(slot, 10));
          let freshBlocked = [];
          try{
            const bs = await blockedSlotsRef.where('date','==',date).get();
            freshBlocked = bs.docs.map(x => Number(x.data().start));
          }catch(e){ /* fall back to the live list */ }
          const busyNow = latest.map(c => slotOccupied(c.slot)).concat(blockedBusyFor(date, freshBlocked));
          if(!planFits(plan, busyNow)){
            state.submitting = false;
            state.submitError = 'Sorry, that start time is no longer available for your booking. Please pick another time.';
            state.formDraft.slot = '';
            delete state.slotAvailabilityByDate[date];
            state.step = 2;
            render();
            loadSlotAvailabilityForDate(date);
            return;
          }

          const newEntries = carRows.map((c, i) => ({
            id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
            name, phone, address, date,
            slot: slotRangeLabel(plan[i].start, plan[i].end),
            carType: c.carType,
            plate: c.plate,
            package: c.pkg, packageName: getPackage(c.pkg).name,
            price: getPrice(c.carType, c.pkg),
            status: 'pending',
            notes: '',
            createdAt: Date.now()
          }));
          const listTotal = newEntries.reduce((sum, e) => sum + e.price, 0);
          const bookingTotal = Math.max(0, listTotal - ftDiscount);
          newEntries.forEach(e => { e.bookingTotal = bookingTotal; });
          if(ftDiscount > 0){
            // newEntries are built in the same order as carRows, so the index lines up.
            const target = newEntries[ftPick.index] || newEntries[0];
            target.firstTime = true; target.firstTimeDiscount = ftDiscount;
          }

          const savedEntries = await addCustomerEntries(newEntries);
          // Best-effort: remember this phone number so it is not treated as new next time.
          try{
            const pid = phoneDocId(phone);
            if(pid && phonesCollectionRef) await phonesCollectionRef.doc(pid).set({ createdAt: Date.now() });
          }catch(e){ /* ignore */ }
          const dayBusy = state.slotAvailabilityByDate[date] || (state.slotAvailabilityByDate[date] = []);
          newEntries.forEach(e => { dayBusy.push(slotOccupied(e.slot)); });
          state.submitting = false;
          state.justSubmitted = true;
          state.lastEntries = savedEntries;
          state.firstTime = false;
          state.step = 1;
          state.formDraft = { name:'', phone:'', address:'', date: firstOpenDate(), slot:'', cars:[{carType:'',plate:'',pkg:DEFAULT_PACKAGE}] };
          render();
          const confirmEl = document.getElementById('confirm-block');
          if(confirmEl) confirmEl.scrollIntoView({ behavior:'smooth', block:'center' });
        }catch(err){
          state.submitting = false;
          if(err && err.code === 'permission-denied'){
            // The slot or a plate marker already exists (someone booked a moment ago) - refresh availability.
            delete state.slotAvailabilityByDate[date];
            state.formDraft.slot = '';
            state.submitError = 'Sorry, that time was just taken or one of the plates is already registered. Please pick another time and try again. If this keeps happening, please contact us.';
            render();
            loadSlotAvailabilityForDate(date);
            return;
          }
          state.submitError = 'Could not save your registration: ' + (err && err.message ? err.message : err);
          render();
        }
      };
    }

    const loginEmail = root.querySelector('#login-email');
    const loginPassword = root.querySelector('#login-password');
    const loginSubmit = root.querySelector('#login-submit');
    if(loginEmail) loginEmail.oninput = () => { state.loginEmail = loginEmail.value; };
    if(loginSubmit && loginEmail && loginPassword){
      const trySignIn = async () => {
        const email = loginEmail.value.trim();
        const password = loginPassword.value;
        state.loginEmail = email;
        if(!email || !password){
          state.pinError = 'Enter your email and password.';
          render();
          return;
        }
        state.loginBusy = true;
        state.pinError = '';
        render();
        try{
          await auth.signInWithEmailAndPassword(email, password);
        }catch(e){
          state.loginBusy = false;
          state.pinError = friendlyAuthError(e);
          render();
        }
      };
      loginSubmit.onclick = trySignIn;
      loginEmail.onkeydown = (e) => { if(e.key === 'Enter') trySignIn(); };
      loginPassword.onkeydown = (e) => { if(e.key === 'Enter') trySignIn(); };
    }

    const signoutBtn = root.querySelector('#signout-btn');
    if(signoutBtn && auth){
      signoutBtn.onclick = () => { auth.signOut(); };
    }

    root.querySelectorAll('.filter-btn').forEach(btn=>{
      if(!btn.dataset.filter) return;
      btn.onclick = () => { state.filter = btn.dataset.filter; render(); };
    });

    const refreshBtn = root.querySelector('#refresh-btn');
    if(refreshBtn){
      refreshBtn.onclick = () => { state.loaded = false; render(); subscribeToCustomers(); };
    }

    const exportBtn = root.querySelector('#export-btn');
    if(exportBtn){
      exportBtn.onclick = () => exportCSV();
    }

    const clearWashedBtn = root.querySelector('#clear-washed-btn');
    if(clearWashedBtn){
      clearWashedBtn.onclick = async () => {
        const washed = state.customers.filter(x => x.status === 'done');
        if(!washed.length){ state.dashError = 'There are no washed jobs to remove.'; render(); return; }
        if(!confirm('Remove ' + washed.length + ' washed job(s)? Customer phone numbers stay recorded, so the first-time discount is not given again. Export a CSV first if you want a copy.')) return;
        state.dashError = '';
        let failed = 0;
        for(const c of washed){
          try{
            await deleteCustomerEntry(c);
            state.customers = state.customers.filter(x => x.id !== c.id);
          }catch(e){ failed++; }
        }
        if(failed) state.dashError = failed + ' job(s) could not be removed. Please try again.';
        render();
      };
    }

    root.querySelectorAll('.job-summary').forEach(summary=>{
      summary.onclick = () => {
        const id = summary.dataset.toggleId;
        if(state.expandedIds.has(id)) state.expandedIds.delete(id);
        else state.expandedIds.add(id);
        render();
      };
    });

    root.querySelectorAll('.toggle-status').forEach(btn=>{
      btn.onclick = async () => {
        const c = state.customers.find(x=>x.id===btn.dataset.id);
        if(!c) return;
        const prev = c.status;
        c.status = c.status === 'done' ? 'pending' : 'done';
        render();
        try{ await updateCustomerEntry(c.id, { status: c.status }); }
        catch(e){ c.status = prev; state.dashError = 'Could not save that change. Please try again.'; render(); }
      };
    });

    root.querySelectorAll('.delete-entry').forEach(btn=>{
      btn.onclick = async () => {
        const removed = state.customers.find(x=>x.id===btn.dataset.id);
        if(!removed) return;
        state.customers = state.customers.filter(x=>x.id!==btn.dataset.id);
        render();
        try{ await deleteCustomerEntry(removed); }
        catch(e){ if(removed) state.customers.push(removed); state.dashError = 'Could not remove that entry. Please try again.'; render(); }
      };
    });

    root.querySelectorAll('.notes-field').forEach(field=>{
      field.onblur = async () => {
        const c = state.customers.find(x=>x.id===field.dataset.id);
        if(!c) return;
        const prev = c.notes;
        c.notes = field.value;
        try{ await updateCustomerEntry(c.id, { notes: c.notes }); }
        catch(e){ c.notes = prev; state.dashError = 'Could not save that note. Please try again.'; render(); }
      };
    });

    root.querySelectorAll('.date-toggle').forEach(btn => {
      btn.onclick = async () => {
        if(!closedDatesRef) return;
        const ds = btn.dataset.date;
        const willClose = !state.closedDates.has(ds);
        if(willClose){
          const n = state.customers.filter(c => c.date === ds).length;
          if(n && !confirm(n + (n > 1 ? ' cars are' : ' car is') + ' already booked on that date. Close it anyway? Existing bookings stay.')) return;
        }
        const prev = state.closedDates;
        const next = new Set(prev);
        if(willClose) next.add(ds); else next.delete(ds);
        state.closedDates = next;
        state.dashError = '';
        render();
        try{
          if(willClose) await closedDatesRef.doc(ds).set({ date: ds, createdAt: Date.now() });
          else await closedDatesRef.doc(ds).delete();
        }catch(e){
          state.closedDates = prev;
          state.dashError = 'Could not update that date. Please try again.';
          render();
        }
      };
    });

    const slotAdminDate = root.querySelector('#slot-admin-date');
    if(slotAdminDate) slotAdminDate.onchange = () => { state.slotAdminDate = slotAdminDate.value; render(); };
    root.querySelectorAll('.slot-toggle').forEach(btn => {
      btn.onclick = async () => {
        if(!blockedSlotsRef) return;
        const ds = btn.dataset.date, start = Number(btn.dataset.start);
        const willBlock = !isSlotBlocked(ds, start);
        if(willBlock){
          const clash = state.customers.filter(c => { if(c.date !== ds || !c.slot) return false; const r = slotRange(c.slot); return r.start < start + START_STEP && r.end > start; }).length;
          if(clash && !confirm('A customer is already booked at ' + formatTimeLabel(start) + ' on that date. Disable it anyway? The existing booking stays.')) return;
        }
        const prev = state.blockedSlots;
        const next = {};
        Object.keys(prev).forEach(k => { next[k] = new Set(prev[k]); });
        next[ds] = next[ds] || new Set();
        if(willBlock) next[ds].add(start); else next[ds].delete(start);
        state.blockedSlots = next;
        state.dashError = '';
        render();
        try{
          const id = blockedSlotId(ds, start);
          if(willBlock) await blockedSlotsRef.doc(id).set({ date: ds, start, createdAt: Date.now() });
          else await blockedSlotsRef.doc(id).delete();
        }catch(e){
          state.blockedSlots = prev;
          state.dashError = 'Could not update that time slot (' + (e && e.code ? e.code : (e && e.message) || 'unknown error') + '). If this says permission-denied, add the carwash_blocked_slots rule in Firestore.';
          render();
        }
      };
    });

    // ---- Payroll tab ----
    const pEmp = root.querySelector('#p-emp');
    const pDate = root.querySelector('#p-date');
    const pAmount = root.querySelector('#p-amount');
    const pNotes = root.querySelector('#p-notes');
    if(pEmp) pEmp.oninput = () => { state.payroll.draft.employee = pEmp.value; };
    if(pDate) pDate.onchange = () => { state.payroll.draft.date = pDate.value; };
    if(pAmount) pAmount.oninput = () => { state.payroll.draft.amount = pAmount.value; };
    if(pNotes) pNotes.oninput = () => { state.payroll.draft.notes = pNotes.value; };

    const payrollSubmit = root.querySelector('#payroll-submit');
    if(payrollSubmit){
      payrollSubmit.onclick = async () => {
        const employee = (pEmp ? pEmp.value : state.payroll.draft.employee).trim();
        const date = pDate ? pDate.value : state.payroll.draft.date;
        const amountRaw = pAmount ? pAmount.value : state.payroll.draft.amount;
        const notes = (pNotes ? pNotes.value : state.payroll.draft.notes).trim();
        const amount = Number(amountRaw);

        if(!employee || !date || amountRaw === '' || isNaN(amount) || amount < 0){
          state.payroll.submitError = 'Please fill in the employee name, date, and a valid amount.';
          render();
          return;
        }

        state.payroll.submitting = true;
        state.payroll.submitError = '';
        render();
        try{
          if(!storageAvailable()) throw new Error('Storage is not available' + (fbInitError ? (': ' + fbInitError) : '.'));
          await payrollCollectionRef.add({ employee, date, amount, notes, createdAt: Date.now() });
          state.payroll.submitting = false;
          state.payroll.draft = { employee: '', date, amount: '', notes: '' };
          render();
        }catch(err){
          state.payroll.submitting = false;
          state.payroll.submitError = 'Could not save this payment: ' + (err && err.message ? err.message : err);
          render();
        }
      };
    }

    root.querySelectorAll('.payroll-filter').forEach(btn=>{
      btn.onclick = () => { state.payroll.filterEmployee = btn.dataset.employee; render(); };
    });

    const payrollRefreshBtn = root.querySelector('#payroll-refresh-btn');
    if(payrollRefreshBtn){
      payrollRefreshBtn.onclick = () => { state.loaded = false; render(); subscribeToPayroll(); };
    }

    const payrollExportBtn = root.querySelector('#payroll-export-btn');
    if(payrollExportBtn){
      payrollExportBtn.onclick = () => exportPayrollCSV();
    }

    root.querySelectorAll('.delete-payroll').forEach(btn=>{
      btn.onclick = async () => {
        const removed = state.payroll.entries.find(x=>x.id===btn.dataset.id);
        state.payroll.entries = state.payroll.entries.filter(x=>x.id!==btn.dataset.id);
        render();
        try{ await deletePayrollEntry(btn.dataset.id); }
        catch(e){ if(removed) state.payroll.entries.push(removed); state.payroll.error = 'Could not remove that entry. Please try again.'; render(); }
      };
    });
  }

  if(auth){
    auth.onAuthStateChanged((user) => {
      const wasUnlocked = state.dashUnlocked;
      state.authReady = true;
      state.loginBusy = false;
      state.dashUnlocked = !!user;
      state.staffEmail = user ? (user.email || '') : '';
      if(user){
        try{ localStorage.setItem('jc_notrack','1'); window['ga-disable-G-EE03Q7FXBM'] = true; }catch(e){}
        state.pinError = '';
        if(state.tab === 'payroll'){ state.loaded = false; render(); subscribeToPayroll(); return; }
        if(state.tab === 'dashboard'){ state.loaded = false; render(); subscribeToCustomers(); return; }
      }else{
        // Signed out: stop listening and wipe staff-only data from memory.
        if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
        if(unsubscribePayrollSnapshot){ unsubscribePayrollSnapshot(); unsubscribePayrollSnapshot = null; }
        state.customers = [];
        state.payroll.entries = [];
        state.live = false;
        state.payroll.live = false;
        state.expandedIds = new Set();
        availabilitySynced = false;
        state.loaded = true;
      }
      if(state.tab === 'dashboard' || state.tab === 'payroll' || wasUnlocked !== state.dashUnlocked) render();
    });
  }else{
    state.authReady = true;
  }

  state.loaded = true;
  render();
  subscribeToReviews();
  loadSlotAvailabilityForDate(state.formDraft.date);
  subscribeToClosedDates();
})();
</script>
</body>
</html>
